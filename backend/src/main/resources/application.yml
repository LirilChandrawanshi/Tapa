spring:
  application:
    name: tapa-backend
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tapa}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

tapa:
  admin:
    # Comma-separated. These phones always carry ADMIN (see AdminBootstrap).
    # Local additions belong in backend/config/application.yml (gitignored),
    # not here — this default is the shared dev number only.
    phones: ${TAPA_ADMIN_PHONES:+919876543210}
  security:
    cookie-domain: ${TAPA_COOKIE_DOMAIN:}
  jwt:
    # override in prod via TAPA_JWT_SECRET
    secret: ${TAPA_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  otp:
    ttl-minutes: 5
    resend-seconds: 28
    max-attempts: 5
  media:
    root: ${TAPA_MEDIA_ROOT:../media}
  razorpay:
    # Blank = gateway off; MockPaymentProvider handles checkout (see
    # PaymentProviderConfig). Put real test keys in backend/config/application.yml
    # (gitignored) or the env — never here.
    key-id: ${TAPA_RAZORPAY_KEY_ID:}
    key-secret: ${TAPA_RAZORPAY_KEY_SECRET:}
    # The secret you type into the Razorpay Dashboard when creating the webhook.
    webhook-secret: ${TAPA_RAZORPAY_WEBHOOK_SECRET:}
    # Overridable so the POC can point the Orders API at a local stand-in.
    base-url: ${TAPA_RAZORPAY_BASE_URL:https://api.razorpay.com}
  cors:
    allowed-origins: ${TAPA_CORS_ORIGINS:http://localhost:*}
  commerce:
    cod:
      # Cash on delivery is OFF until the business signs it off. Turning it on
      # is only the first gate — each pincode must also carry codAllowed=true
      # (admin-managed) before COD appears at checkout.
      enabled: ${TAPA_COD_ENABLED:false}
      max-order-paise: ${TAPA_COD_MAX_PAISE:500000}     # ₹5,000
      fee-paise: ${TAPA_COD_FEE_PAISE:0}
      allow-prebook: ${TAPA_COD_ALLOW_PREBOOK:false}

logging:
  level:
    co.thetapa: DEBUG
